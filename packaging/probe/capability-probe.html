const GLYPH = { PASS: "✓", FAIL: "✗", UNKNOWN: "?", ABSENT: "-", INFO: "i" };

const out = document.getElementById("out");
function say(status, label, detail) {

  out.textContent = lines.join("\n");
}
const has = (cond) => (cond ? "PASS" : "ABSENT");
const timeout = (ms) => new Promise((r) => setTimeout(r, ms));

function b64ToBytes(b64) {
  const s = atob(b64);
  const u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return u;
}

// Minimal stand-in for the engine's read loop: bumps slot 1 (C_READ_POS in
// src/control-layout.js) by the rate in slot 0 on each render quantum.
const WORKLET_SRC =
  "class P extends AudioWorkletProcessor{constructor(o){super(o);this.c=new Float64Array(o.processorOptions.control);}" +
  "process(i,o){this.c[1]+=this.c[0]*128;return true;}}registerProcessor('probe-read',P);";

async function probeAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { say("ABSENT", "AudioContext"); return; }
  let ctx;
  try { ctx = new AC(); } catch (e) { say("FAIL", "AudioContext construct", String(e)); return; }
  say("INFO", "AudioContext state", ctx.state + ", sampleRate " + ctx.sampleRate);
  try { await ctx.resume(); } catch (e) { say("FAIL", "AudioContext resume", String(e)); }
  say(ctx.state === "running" ? "PASS" : "FAIL", "AudioContext running after the button press", ctx.state);
  say("INFO", "baseLatency (s, raw)", String(ctx.baseLatency));
  say("INFO", "outputLatency (s, raw)", String(ctx.outputLatency));
  if (ctx.outputLatency === undefined) say("ABSENT", "outputLatency property");

  // Codec decode
  for (const name of Object.keys(FIXTURES)) {
    try {
      const bytes = b64ToBytes(FIXTURES[name]);
      const buf = await ctx.decodeAudioData(bytes.buffer.slice(0));
      say(buf.length > 0 ? "PASS" : "FAIL", "decodeAudioData " + name, buf.length + " frames at " + buf.sampleRate + " Hz");
    } catch (e) {
      say("FAIL", "decodeAudioData " + name, String(e && e.name ? e.name : e));
    }
  }

  // AudioWorklet registration and the engine's SAB read path
  if (!ctx.audioWorklet) { say("ABSENT", "AudioWorklet"); await ctx.close(); return; }
  const sabOk = typeof SharedArrayBuffer !== "undefined" && self.crossOriginIsolated === true;
  let url;
  try {
    url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: "text/javascript" }));
    await ctx.audioWorklet.addModule(url);
    say("PASS", "AudioWorklet registration", "module loaded from a blob: URL under the page scheme " + location.protocol);
  } catch (e) {
    say("FAIL", "AudioWorklet registration", String(e && e.name ? e.name : e));
    if (url) URL.revokeObjectURL(url);
    await ctx.close();
    return;
  }
  if (!sabOk) {
    say("UNKNOWN", "SAB path advances C_READ_POS", "not testable: SharedArrayBuffer or crossOriginIsolated missing; the engine would use its message fallback");
  } else {
    try {
      const sab = new SharedArrayBuffer(8 * Float64Array.BYTES_PER_ELEMENT);
      const ctl = new Float64Array(sab);
      ctl[0] = 1;
      const node = new AudioWorkletNode(ctx, "probe-read", { numberOfInputs: 0, numberOfOutputs: 1, processorOptions: { control: sab } });
      node.connect(ctx.destination);
      await timeout(600);
      const pos = ctl[1];
      say(pos > 0 ? "PASS" : "FAIL", "SAB path advances C_READ_POS", "read position after 600 ms = " + pos + " frames");
      node.disconnect();
    } catch (e) {
      say("FAIL", "SAB path advances C_READ_POS", String(e && e.name ? e.name : e));
    }
  }
  URL.revokeObjectURL(url);
  await ctx.close();
}

function probeStorage() {
  try {
    const k = "runout-probe-runs";
    const prev = Number(localStorage.getItem(k) || "0");
    localStorage.setItem(k, String(prev + 1));
    say("INFO", "localStorage persistence", "this is run number " + (prev + 1) + "; run twice with a full app restart between, the second run should say 2 or more");
    say(prev > 0 ? "PASS" : "UNKNOWN", "localStorage survived since an earlier run", prev > 0 ? "yes" : "first run, cannot tell yet");
  } catch (e) {
    say("FAIL", "localStorage", String(e && e.name ? e.name : e));
  }
}

function probeFeatures() {
  say("INFO", "user agent", navigator.userAgent);
  say("INFO", "location protocol", location.protocol);
  say(self.crossOriginIsolated === true ? "PASS" : "FAIL", "crossOriginIsolated", String(self.crossOriginIsolated));
  say(has(typeof SharedArrayBuffer !== "undefined"), "SharedArrayBuffer");
  say(has(typeof window.showDirectoryPicker === "function"), "showDirectoryPicker");
  const inp = document.createElement("input");
  say(has("webkitdirectory" in inp), "webkitdirectory on file input");
  say(has(typeof Element.prototype.setPointerCapture === "function"), "pointer capture");
  say(has(!!(navigator.audioSession)), "navigator.audioSession", navigator.audioSession ? "type " + navigator.audioSession.type : "");
}

document.getElementById("run").addEventListener("click", async () => {
  lines.length = 0;
  say("INFO", "Runout capability probe", "RP-1");
  probeFeatures();
  probeStorage();
  try { await probeAudio(); } catch (e) { say("FAIL", "probe aborted", String(e)); }
  say("INFO", "done", "copy this text into STATE.md");
});
document.getElementById("copy").addEventListener("click", () => {
  const r = document.createRange();
  r.selectNodeContents(out);
  const s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
});
</script>
</body>
