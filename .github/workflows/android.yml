name: Android APK

# Builds a sideloadable debug APK of the Runout web app wrapped in Capacitor.
# This container has no Android SDK, so the build runs here, where the
# GitHub-hosted runner already ships the SDK + build-tools. The APK lands as a
# downloadable artifact on every push (and on-demand via "Run workflow"). Only main publishes the rolling v0-latest release;
# claude/** branches build (the artifact is still downloadable) but never touch the public release.
#
# Caveat (spec §3): a Capacitor APK runs the web build inside the system
# WebView, which uses the web-Android audio output path the spec flags as the
# latency weak point — and cross-origin isolation headers aren't sent for the
# local scheme, so SharedArrayBuffer is unavailable and the engine takes its
# postMessage fallback. This measures *wrapped-web* feel, not native Oboe.

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: android-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      short: ${{ steps.apkname.outputs.short }}
      file: ${{ steps.apkname.outputs.file }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # Correctness gate for the pure model layer (radius↔time inversion,
      # platter physics, envelope DSP). Fast, dependency-free; fails the build
      # before we bother wrapping an APK around a broken model.
      - name: Test the model layer
        run: npm test

      - name: Stage web app into www/
        run: npm run build:web

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Add Android platform
        run: npx --no-install cap add android

      - name: Install the Runout launcher icon
        run: |
          pip install --quiet pillow
          python3 scripts/apply-icon.py

      # Runout's own native plugins (the phone's audio library: MediaStore scan + byte reads).
      # Copies native/android/*.java into the generated project, adds the narrow audio permissions
      # to the manifest and registers the plugin in MainActivity. Fails the build if an anchor moved.
      - name: Install Runout native plugins (device audio library)
        run: node scripts/apply-android-plugins.mjs android

      # Device mode (docs/DEVICE_MODE.md): the DeviceDisplay plugin (keep-screen-on, AOD brightness, preferred refresh rate).
      # No permissions needed. Fails the build if the MainActivity anchor moved.
      - name: Install Runout display plugin (Device mode)
        run: node scripts/apply-android-display.mjs android

      # Background playback (foreground MediaPlaybackService + DevicePlayback plugin), the hardware-Back fallback, the edge-gesture exclusion,
      # and the app-level manifest / theme settings (black system bars, allowBackup=false, adjustResize). Fails the build if an anchor moved.
      - name: Install Runout playback service, Back / gesture glue and black theme
        run: node scripts/apply-android-playback.mjs android

      - name: Sync web assets into the Android project
        run: npx --no-install cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      # Give the APK a UNIQUE, per-commit filename. Reusing app-debug.apk meant
      # browsers and Android's download manager served a stale cached copy, so
      # new builds looked like they "didn't ship". A unique name is cache-proof.
      - name: Name the APK by commit
        id: apkname
        run: |
          SHORT=$(git rev-parse --short HEAD)
          cp android/app/build/outputs/apk/debug/app-debug.apk "runout-${SHORT}.apk"
          echo "file=runout-${SHORT}.apk" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runout-debug-apk
          path: |
            ${{ steps.apkname.outputs.file }}
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Publishing is its own job: contents:write is held only here, never while dependencies are installed or Gradle runs.
  # main only: a push to claude/** (or any other branch) builds and uploads the artifact but never overwrites the public release.
  publish:
    needs: build-apk
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: android-publish
      cancel-in-progress: false
    steps:
      - name: Download the built APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runout-debug-apk
          path: dist

      # Publish to the rolling v0 release. We upload BOTH:
      #   • runout-<sha>.apk — unique per build, cache-proof, the link to share
      #   • app-debug.apk    — stable name, for anyone who wants the latest
      # Download (cache-proof):
      #   https://github.com/mbaliga/Music_Player/releases/download/v0-latest/runout-<sha>.apk
      - name: Publish APK to the rolling v0 release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v0-latest
          target_commitish: ${{ github.sha }}
          name: Runout v0 — latest debug APK
          prerelease: true
          body: >
            Auto-built debug APK from the latest push on main
            (build ${{ needs.build-apk.outputs.short }}). v0 web build wrapped in a
            Capacitor WebView (postMessage fallback, not native Oboe — see README
            §3). For a guaranteed-fresh download use the per-build file
            runout-${{ needs.build-apk.outputs.short }}.apk rather than the cached
            app-debug.apk.
          files: |
            dist/${{ needs.build-apk.outputs.file }}
            dist/android/app/build/outputs/apk/debug/app-debug.apk
